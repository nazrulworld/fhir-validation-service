openapi: 3.0.3
info:
  title: FHIR Validation Service API
  description: >-
    A Vert.x-based FHIR validation service with PostgreSQL. Every error response is an RFC 9457 problem document
    (application/problem+json). Every response carries an X-Request-Id header.
  version: 1.0.0

servers:
  - url: http://localhost:8880
    description: Local development server (replace with your server)

paths:
  /health:
    get:
      operationId: healthApiHealth
      summary: Detailed health report
      description: Database connectivity plus the readiness report.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /health/liveness:
    get:
      operationId: healthApiLiveness
      summary: Liveness probe (process only; never depends on dependencies)
      responses:
        '200':
          description: Service is live
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [UP]
                  timestamp:
                    type: integer
                    format: int64

  /health/readiness:
    get:
      operationId: healthApiReadiness
      summary: Readiness probe
      description: >-
        200 when this instance can serve traffic: database reachable, a usable validator for every enabled FHIR
        version (none out of date), and not draining. Otherwise 503 with the reasons.
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'

  /metrics:
    get:
      operationId: metricsApiScrape
      summary: Prometheus metrics (text exposition format)
      responses:
        '200':
          description: Metrics
          content:
            text/plain:
              schema:
                type: string

  /{version}/validate:
    post:
      operationId: validationApiValidate
      summary: Validate a FHIR resource
      description: >-
        Content negotiation: Accept absent, */* or application/json returns the ValidationResponse JSON shape;
        application/fhir+json, application/fhir+xml and application/xml return a FHIR OperationOutcome.
        A completed validation answers 200 whether the resource is valid or not.
      parameters:
        - name: version
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/FhirVersion'
        - name: profile
          in: query
          required: false
          description: Comma-separated canonical URLs of profiles to validate against (in addition to meta.profile)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
          application/fhir+json:
            schema:
              type: object
          application/xml:
            schema:
              type: string
          application/fhir+xml:
            schema:
              type: string
          text/xml:
            schema:
              type: string
      responses:
        '200':
          description: Validation completed (see `valid` / the OperationOutcome issues)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
            application/fhir+json:
              schema:
                $ref: '#/components/schemas/OperationOutcome'
            application/fhir+xml:
              schema:
                type: string
                description: FHIR OperationOutcome (XML)
            application/xml:
              schema:
                type: string
                description: FHIR OperationOutcome (XML)
        '400':
          $ref: '#/components/responses/Problem'
        '406':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'

  /{version}/include-ig:
    post:
      operationId: validationApiIncludeIg
      summary: Include a stored Implementation Guide in the validator configuration of a FHIR version
      description: >-
        Replaces any other version of the same package. The response confirms the committed configuration; other
        instances apply it within the propagation window.
      parameters:
        - name: version
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/FhirVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - igPackageId
              properties:
                igPackageId:
                  type: string
                igPackageVersion:
                  type: string
                  default: latest
      responses:
        '200':
          description: IG included
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncludeResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'

  /{version}/register-profile:
    post:
      operationId: profileApiRegisterProfile
      summary: Register a custom profile (StructureDefinition)
      parameters:
        - name: version
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/FhirVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  format: uri
      responses:
        '200':
          description: Profile registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [success]
                  profileUrl:
                    type: string
                    format: uri
                  revision:
                    type: integer
                    format: int64
        '400':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'

  /igs/upload:
    post:
      operationId: igPackageApiUploadIg
      summary: Upload and store an Implementation Guide package
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: The IG package archive (.tgz). Size limit is FV_HTTP_MAX_BODY_MB.
            encoding:
              file:
                contentType: application/octet-stream, application/gzip, application/x-gzip, application/x-tar, application/x-compressed-tar
      responses:
        '200':
          description: IG package stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IgRegistrationResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'

  /igs/register:
    post:
      operationId: igPackageApiRegisterIg
      summary: Fetch and store an Implementation Guide package (from a registry or an approved URL)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                downloadUrl:
                  type: string
                  format: uri
                name:
                  type: string
                version:
                  type: string
                  default: latest
                includeDependency:
                  type: boolean
                  default: true
      responses:
        '200':
          description: IG package stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IgRegistrationResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'

  /igs/{name}/{version}/dependencies:
    get:
      operationId: igPackageApiGetDependenciesGraph
      summary: Declared dependencies of a stored IG package
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dependencies retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  version:
                    type: string
                  dependencies:
                    type: array
                    items:
                      type: string
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'

  /igs/{name}/{version}/conformance:
    get:
      operationId: igPackageApiGenerateConformanceReport
      deprecated: true
      summary: Files of a stored IG package (deprecated; not a conformance report)
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Package file listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  version:
                    type: string
                  files:
                    type: array
                    items:
                      type: string
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: >-
        API key as `Authorization: Bearer <key>`. Administrative operations (upload/register IG, include-ig,
        register-profile) always require an ADMIN key. Validation and read operations require a VALIDATE or ADMIN key
        only when FV_AUTH_ANONYMOUS_VALIDATE=false. Enforced by the service (see contracts/http-api.md).

  responses:
    Problem:
      description: Error (RFC 9457 problem details)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    FhirVersion:
      type: string
      pattern: '^([Ss][Tt][Uu]3|[Rr]4[Bb]?|[Rr]5)$'
      description: Supported FHIR versions (STU3, R4, R4B, R5), case-insensitive

    ReadinessResponse:
      type: object
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        timestamp:
          type: integer
          format: int64
        versions:
          type: object
          description: Per FHIR version state (ACTIVE, BUILDING, STALE, ABSENT), revisions and packages
        reasons:
          type: array
          items:
            type: string

    Problem:
      type: object
      description: RFC 9457 problem details (media type application/problem+json)
      required: [type, title, status, correlationId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: Curated, safe text. Never exception messages, class names or stack traces
        correlationId:
          type: string
          description: Same as the X-Request-Id response header
        issues:
          type: array
          description: Present only for type invalid-resource
          items:
            $ref: '#/components/schemas/ValidationMessage'

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        timestamp:
          type: integer
          format: int64
        postgres:
          type: object
          properties:
            status:
              type: string
              enum: [UP, DOWN]
            responseTime:
              type: integer
              format: int64
            error:
              type: string
        readiness:
          $ref: '#/components/schemas/ReadinessResponse'

    ValidationMessage:
      type: object
      properties:
        severity:
          type: string
          enum: [FATAL, ERROR, WARNING, INFORMATION]
        location:
          type: string
        message:
          type: string

    ValidationResponse:
      type: object
      properties:
        valid:
          type: boolean
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ValidationMessage'
        fhirVersion:
          type: string
        appliedProfiles:
          type: array
          items:
            type: string

    OperationOutcome:
      type: object
      description: FHIR OperationOutcome resource
      properties:
        resourceType:
          type: string
          enum: [OperationOutcome]

    IncludeResponse:
      type: object
      properties:
        status:
          type: string
          enum: [success]
        fhirVersion:
          type: string
        revision:
          type: integer
          format: int64
        included:
          type: array
          items:
            type: string
        resolved:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string

    IgRegistrationResponse:
      type: object
      properties:
        status:
          type: string
          enum: [success]
        name:
          type: string
        version:
          type: string
