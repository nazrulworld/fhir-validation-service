# FHIR Validation Service — local / small deployments.
#
#   cp .env.example .env   # then set PG_PASSWORD and FV_ADMIN_API_KEY
#   docker compose up -d --wait                     # postgres + one validator on 127.0.0.1:8880
#
# Every published port binds to 127.0.0.1. PostgreSQL is not published. To reach it from the host, create a
# git-ignored compose.override.yaml (merged automatically by Compose):
#
#   services:
#     postgres:
#       ports: ["127.0.0.1:54329:5432"]

name: ${COMPOSE_PROJECT_NAME:-fhir}

x-validator: &validator
  image: ghcr.io/nazrulworld/fhir-validation-service:${FV_TAG:-latest}
  build:
    context: .
  env_file: .env
  environment:
    FV_PG_HOST: postgres
    FV_PG_PORT: "5432"
    FV_PG_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
    FV_HTTP_PORT: "8880"
  depends_on:
    postgres:
      condition: service_healthy
  # 2 GB container = 1.5 GB heap at 75%: ~0.9 GB for 4 warmed FHIR versions, room for IG sets up to ~100 MB expanded.
  # Larger IGs need more (a 20 MB IG: 3g or more); see FV_MEMORY_LIMIT in contracts/configuration.md.
  mem_limit: ${FV_MEMORY_LIMIT:-2g}
  stop_grace_period: 30s
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8880/health/readiness"]
    interval: 15s
    timeout: 3s
    start_period: 120s
    retries: 4

services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: ${FV_PG_DATABASE:-fhir_validator}
      POSTGRES_USER: ${FV_PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  validator:
    <<: *validator
    ports:
      - "127.0.0.1:${FV_HTTP_PORT:-8880}:8880"

  # --- profile: cluster — two validators behind a load balancer on 127.0.0.1:8881 ---------------------------
  validator-2:
    <<: *validator
    profiles: [cluster]

  lb:
    image: nginx:1.27-alpine
    profiles: [cluster]
    volumes:
      - ./docker/nginx/lb.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8881:80"
    depends_on:
      validator:
        condition: service_healthy
      validator-2:
        condition: service_healthy
    restart: unless-stopped

  # --- profile: observability — Prometheus on 127.0.0.1:9090 plus a PostgreSQL exporter --------------------------
  prometheus:
    image: prom/prometheus:v2.53.2
    profiles: [observability]
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    profiles: [observability]
    environment:
      DATA_SOURCE_NAME: "postgresql://${FV_PG_USER:-postgres}:${PG_PASSWORD:?set PG_PASSWORD in .env}@postgres:5432/${FV_PG_DATABASE:-fhir_validator}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # --- profile: admin — pgAdmin on 127.0.0.1:5050 (credentials required, no defaults) -----------------------
  pgadmin:
    image: dpage/pgadmin4:9.4.0
    profiles: [admin]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?set PGADMIN_DEFAULT_PASSWORD in .env}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  pgadmin-data:
