# Round-robin over the two validators of the compose `cluster` profile (one shared database).
upstream validators {
    server validator:8880 max_fails=1 fail_timeout=5s;
    server validator-2:8880 max_fails=1 fail_timeout=5s;
}

server {
    listen 80;
    client_max_body_size 25m;

    location / {
        proxy_pass http://validators;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $http_x_request_id;
        # An instance that is draining or not ready answers 503: retry on the other one.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_read_timeout 60s;
    }
}
