name: CI

on:
  pull_request:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  workflow_dispatch:
    inputs:
      upgrade-rehearsal:
        description: Run the 0.1.2 -> 1.0.0 upgrade rehearsal (docs/upgrade-1.0.md)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
      - name: Unit, integration (Testcontainers) and contract tests
        run: ./mvnw -B verify

  container:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - name: Prepare .env for CI
        run: |
          cp .env.example .env
          sed -i "s/^PG_PASSWORD=.*/PG_PASSWORD=ci-$(openssl rand -hex 12)/" .env
          sed -i "s/^FV_ADMIN_API_KEY=.*/FV_ADMIN_API_KEY=ci$(openssl rand -hex 24)/" .env
      - name: Validate compose file
        run: docker compose config -q
      - name: Smoke test (build, start, validate, graceful stop)
        run: sh scripts/smoke.sh
      - name: Tear down
        if: always()
        run: docker compose down -v

  arm64-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/arm64 image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: fhir-validation-service:arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Startup smoke test under QEMU (liveness, migration, graceful stop)
        run: sh scripts/startup-smoke.sh fhir-validation-service:arm64 linux/arm64

  upgrade-rehearsal:
    if: github.event_name == 'workflow_dispatch' && inputs.upgrade-rehearsal
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rehearse the documented upgrade
        run: sh scripts/upgrade-rehearsal.sh
