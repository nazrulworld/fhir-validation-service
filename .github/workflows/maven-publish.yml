name: Maven Package

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Build and test
        run: ./mvnw -B verify

      # compose.yaml references the published image, so these assets work without a source checkout.
      - name: Attach jar, compose file and environment template to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/fhir-validation-service-*.jar
            compose.yaml
            .env.example
            docs/upgrade-1.0.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        run: ./mvnw -B deploy -DskipTests -s $GITHUB_WORKSPACE/settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
